[package]
publish = false  # internal workspace member; path-dep, never published to crates.io
name = "rmd-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rmd-protocol.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
bytes.workspace = true

# macOS screen capture via ScreenCaptureKit, using the pure-Rust objc2 framework
# bindings (ADR-0005 primary). No Swift/Metal build step — unlike the
# `screencapturekit` convenience crate, whose mandatory `apple-metal` dep runs a
# Swift bridge build that is broken against the current SDK. Feature flags gate
# each ObjC class/method and are tuned in this manifest.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSArray",
    "NSError",
] }
# ScreenCaptureKit classes live in the `SCStream` / `SCShareableContent` modules
# (there is no per-class feature). `block2` gates the async completion-handler
# methods; `dispatch2` gates `addStreamOutput:type:sampleHandlerQueue:error:`;
# `objc2-core-media` pulls in `CMTime`/`CMSampleBuffer` used by the stream config
# and the output callback.
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "dispatch2",
    "objc2-core-media",
    "SCStream",
    "SCShareableContent",
] }
# `objc2-core-video` enables `CMSampleBuffer::image_buffer()`; `objc2` enables the
# objc2 `RefEncode` impls so `CMSampleBuffer`/`CMTime` can appear in method sigs.
objc2-core-media = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "CMSampleBuffer",
    "CMTime",
    "CMBlockBuffer",
    "objc2-core-video",
    "objc2-core-audio-types",
] }
# AudioBufferList / AudioBuffer for extracting PCM from audio CMSampleBuffers
# (desktop-audio capture via ScreenCaptureKit).
objc2-core-audio-types = { version = "0.3", default-features = false, features = [
    "std",
    "objc2",
    "CoreAudioBaseTypes",
] }
# CV pixel-buffer lock/geometry FFI. `CVBase`/`CVReturn` are required by the
# `CVPixelBufferLockBaseAddress` cfg gate.
objc2-core-video = { version = "0.3", default-features = false, features = [
    "std",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
] }
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
block2 = "0.6"

# Linux X11 screen capture via XGetImage (x11rb). XShm is a future optimization.
# Wayland capture goes through the xdg-desktop-portal ScreenCast interface
# (`ashpd`, tokio backend, no GTK) to obtain a PipeWire remote, then reads frames
# off a PipeWire stream (`pipewire`/`libspa`). The portal shows a one-time
# "share your screen" consent dialog on first use.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
ashpd = { version = "0.9", default-features = false, features = ["tokio"] }
pipewire = "0.8"
libspa = "0.8"
tokio = { workspace = true }
# Direct D-Bus to org.gnome.Mutter.ScreenCast for the GNOME backend (no portal
# consent prompt, and the session is torn down cleanly on Stop). Pinned to the
# same major ashpd already resolves so Cargo unifies to one zbus.
zbus = { version = "4", default-features = false, features = ["tokio"] }
futures-util = "0.3"

[[example]]
name = "capture_smoke"
path = "examples/capture_smoke.rs"
