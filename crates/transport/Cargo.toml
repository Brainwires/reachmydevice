[package]
publish = false  # internal workspace member; path-dep, never published to crates.io
name = "rmd-transport"
version.workspace = true
edition.workspace = true
# rtci 0.2.0 requires Rust 1.89 (the workspace floor is 1.85).
rust-version = "1.89"
license.workspace = true

[dependencies]
rmd-protocol.workspace = true
tokio.workspace = true
bytes.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true

# Random SSRC generation for the video send track.
rand = "0.9"

# Enumerate local network interfaces to build multi-interface ICE host
# candidates when the transport socket binds to the wildcard address.
if-addrs = "0.13"

# WebRTC via the sans-IO `rtci` engine (crates.io; MIT OR Apache-2.0), the
# successor of the vendored `rtc` fork (ADR-0003). Everything we use
# (peer_connection, rtp, media, interceptor, sansio, sdp, shared, stun, turn) is
# re-exported from the top-level `rtci` crate. rtci needs Rust 1.89, hence this
# crate's own `rust-version` above.
rtci = "0.2.0"

[dev-dependencies]
tracing-subscriber = { workspace = true }
